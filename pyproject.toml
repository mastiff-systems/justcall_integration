[project]
name = "justcall_integration"
authors = [
    { name = "Mastiff Systems", email = "despiritu@mastiffsystems.com"}
]
description = "JustCall"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
# Frappe Cloud validates these against the apps on the bench before every build and fails
# the deploy ("Incompatible app version") when one does not match. The app only uses
# telephony.utils (TP Call Log linking) and Helpdesk HD Ticket / HD Form Script.
# frappe is pinned to the v16 major line. Helpdesk and Telephony only get a lower bound:
# their version numbers are not stable (Helpdesk went from 1.31 to 16.1 when its version-16
# branch was cut in 2026-11), so an upper bound only blocks updates.
frappe = ">=16.0.0,<17.0.0"
helpdesk = ">=1.30.0"
telephony = ">=0.0.1"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
